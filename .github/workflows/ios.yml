name: Сборка iOS (IPA)

on:
  workflow_dispatch:   # запускается вручную: Actions → «Сборка iOS (IPA)» → Run workflow

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Godot 4.7.2 для macOS
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Версия из scripts/build.gd
        run: |
          echo "BUILD=$(grep -oP 'BUILD := \K[0-9]+' scripts/build.gd)" >> "$GITHUB_ENV"
          echo "VERSION=$(grep -oP 'VERSION := "\K[^"]+' scripts/build.gd)" >> "$GITHUB_ENV"
          sed -i "s/application\/short_version=\"[^\"]*\"/application\/short_version=\"$(grep -oP 'VERSION := "\K[^"]+' scripts/build.gd)\"/; s/application\/version=\"[^\"]*\"/application\/version=\"$(grep -oP 'BUILD := \K[0-9]+' scripts/build.gd)\"/" export_presets.cfg

      - name: Шаблоны экспорта iOS
        run: python3 tools/get_templates.py "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable" ios.zip

      - name: Экспорт проекта Xcode из Godot
        run: |
          mkdir -p build
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --export-release "iOS" build/NightHunterNeon.ipa || true
          ls -la build
          test -d build/NightHunterNeon.xcodeproj

      - name: Сборка приложения (без подписи — подпишет Sideloadly)
        run: |
          cd build
          xcodebuild -project NightHunterNeon.xcodeproj -scheme NightHunterNeon \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/NightHunterNeon.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" | tail -40
          rm -rf Payload && mkdir Payload
          cp -R NightHunterNeon.xcarchive/Products/Applications/*.app Payload/
          rm -f NightHunterNeon.ipa
          zip -qry NightHunterNeon_ios.ipa Payload
          ls -la NightHunterNeon_ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NightHunterNeon_ios
          path: build/NightHunterNeon_ios.ipa
