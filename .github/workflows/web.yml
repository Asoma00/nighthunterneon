name: Веб-версия для iPhone (GitHub Pages)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Шаблон веб-экспорта
        run: python3 tools/get_templates.py "$HOME/.local/share/godot/export_templates/4.7.2.stable" web_nothreads_release.zip

      - name: Версия из scripts/build.gd
        run: |
          echo "BUILD=$(grep -oP 'BUILD := \K[0-9]+' scripts/build.gd)" >> "$GITHUB_ENV"
          V=$(grep -oP 'VERSION := "\K[^"]+' scripts/build.gd)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # Windows требует 4 числа: 0.14.1 → 0.14.1.0
          echo "FILEVER=$(echo "$V.0.0.0" | cut -d. -f1-4)" >> "$GITHUB_ENV"

      - name: Экспорт веб-версии
        run: |
          mkdir -p build/web dist_out
          touch build/.gdignore dist_out/.gdignore
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.wasm

      - name: Пакет автообновления для ПК, Steam Deck, Android и iOS
        run: |
          BUILD=$(grep -oP 'BUILD := \K[0-9]+' scripts/build.gd)
          VERSION=$(grep -oP 'VERSION := "\K[^"]+' scripts/build.gd)
          mkdir -p build/web/update
          "$GODOT" --headless --path . --export-pack "Linux" "build/web/update/game_${BUILD}.pck"
          SUM=$(sha256sum "build/web/update/game_${BUILD}.pck" | cut -d' ' -f1)
          SIZE=$(stat -c%s "build/web/update/game_${BUILD}.pck")
          printf '{"build":%s,"version":"%s","pack":{"file":"game_%s.pck","sha256":"%s","size":%s}}\n' "$BUILD" "$VERSION" "$BUILD" "$SUM" "$SIZE" > build/web/update/version.json
          cat build/web/update/version.json

      - name: Шаблоны и инструменты для Windows, Steam Deck и Android
        run: |
          python3 tools/get_templates.py "$HOME/.local/share/godot/export_templates/4.7.2.stable" windows_release_x86_64.exe linux_release.x86_64 android_release.apk
          mkdir -p "$HOME/fakesdk/platform-tools" "$HOME/fakesdk/build-tools/35.0.0" "$HOME/.config/godot"
          printf '#!/bin/sh\necho "Android Debug Bridge version 1.0.41"\n' > "$HOME/fakesdk/platform-tools/adb"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/fakesdk/build-tools/35.0.0/apksigner"
          chmod +x "$HOME/fakesdk/platform-tools/adb" "$HOME/fakesdk/build-tools/35.0.0/apksigner"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$HOME/fakesdk" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
          curl -sSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          sed -i "s/application\/file_version=\"[^\"]*\"/application\/file_version=\"$FILEVER\"/; s/application\/product_version=\"[^\"]*\"/application\/product_version=\"$FILEVER\"/; s/version\/code=[0-9]*/version\/code=$BUILD/; s/version\/name=\"[^\"]*\"/version\/name=\"$VERSION\"/" export_presets.cfg

      - name: Сборки для скачивания (Windows, Steam Deck, Android)
        run: |
          D=build/web/download
          mkdir -p "$D" dist_out/win dist_out/deck/NightHunterNeon
          "$GODOT" --headless --path . --export-release "Windows Desktop" "dist_out/win/Ночь охотника Неон.exe"
          sed "s/{VERSION}/$VERSION/g" dist/README_Windows.txt > dist_out/win/README.txt
          (cd dist_out/win && zip -q -9 "../../$D/NightHunterNeon_Windows.zip" *)
          "$GODOT" --headless --path . --export-release "Linux" dist_out/deck/NightHunterNeon/NightHunterNeon.x86_64
          chmod +x dist_out/deck/NightHunterNeon/NightHunterNeon.x86_64
          cp "dist/КАК УСТАНОВИТЬ НА STEAM DECK.txt" dist_out/deck/NightHunterNeon/
          tar -C dist_out/deck -czf "$D/NightHunterNeon_SteamDeck.tar.gz" NightHunterNeon
          "$GODOT" --headless --path . --export-release "Android" dist_out/game.apk
          java -jar uber-apk-signer.jar --apks dist_out/game.apk
          cp dist_out/game-aligned-debugSigned.apk "$D/NightHunterNeon_android.apk"
          sed "s/{VERSION}/$VERSION/g; s/{BUILD}/$BUILD/g" dist/download.html > "$D/index.html"
          ls -la "$D"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
