name: Аниме-ролики (Blender)

# Рендер сюжетных роликов в аниме-стиле: Blender EEVEE (программный OpenGL),
# контур Freestyle, кодирование в .ogv. Каждая сцена — отдельная параллельная
# сборка; результат выкладывается в ветку video-<сцена>.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Сцены через пробел"
        required: true
        default: "prologue omega_meet ch1_end ash_meet ch2_end chorus_meet finale boss_lich boss_colossus boss_queen boss_omega"
      test:
        description: "Кадров на блок для пробы (0 — все)"
        required: false
        default: "0"
      res:
        description: "Разрешение"
        required: false
        default: "1280x720"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: |
          L=$(echo "${{ github.event.inputs.scenes }}" | python3 -c "import sys,json;print(json.dumps(sys.stdin.read().split()))")
          echo "list=$L" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJson(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Библиотеки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 mesa-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 ffmpeg > /dev/null
      - name: Blender 4.2 LTS
        run: |
          curl -sSL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
      - name: Рендер
        run: |
          T=""
          if [ "${{ github.event.inputs.test }}" != "0" ]; then T="--test ${{ github.event.inputs.test }}"; fi
          START=$(date +%s)
          xvfb-run -a -s "-screen 0 1280x720x24" ./blender/blender -b --factory-startup -P tools/blender/anime_video.py -- tools/blender/specs.json tools/blender/scenes.json frames ${{ matrix.scene }} --res ${{ github.event.inputs.res }} $T 2>&1 | grep -vE "^(Fra:|Read prefs|Blender quit)|Rendering .* / .* samples|Shaders" | tail -150
          echo "SECONDS: $(( $(date +%s) - START ))"
          ls frames | head; ls frames | wc -l
      - name: Видео
        run: |
          mkdir -p seq out
          n=0
          for f in $(ls frames/*.png | sort); do n=$((n+1)); cp "$f" "seq/$(printf %05d $n).png"; done
          ffmpeg -loglevel error -y -framerate 12 -i seq/%05d.png -c:v libtheora -q:v 8 -pix_fmt yuv420p out/${{ matrix.scene }}.ogv
          STEP=18; if [ "${{ github.event.inputs.test }}" != "0" ]; then STEP=1; fi
          i=0; for f in $(ls seq/*.png | awk -v s=$STEP 'NR%s==1 || s==1'); do i=$((i+1)); cp $f out/${{ matrix.scene }}_s$(printf %03d $i).png; done
          ls -la out | head -40
      - name: Выложить в ветку
        run: |
          cd out
          git init -q -b video-${{ matrix.scene }}
          git config user.name "github-actions"
          git config user.email "actions@github.invalid"
          git add -A
          git commit -q -m "Ролик ${{ matrix.scene }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" video-${{ matrix.scene }}
