name: Модели кат-сцен (Blender)

# Blender строит 3D-персонажей для кат-сцен из tools/blender/specs.json
# и выкладывает .glb и превью-рендеры как артефакт сборки.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Ключи персонажей через пробел (пусто — все)"
        required: false
        default: ""
      preview:
        description: "Превью-рендеры Cycles"
        required: false
        default: "yes"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Библиотеки для Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 > /dev/null
      - name: Скачать Blender 4.2 LTS
        run: |
          curl -sSL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          ./blender/blender --version | head -1
      - name: Построить модели
        run: |
          P=""
          if [ "${{ github.event.inputs.preview }}" = "yes" ]; then P="--preview"; fi
          ./blender/blender -b --factory-startup -P tools/blender/build_cine.py -- tools/blender/specs.json out $P ${{ github.event.inputs.keys }} 2>&1 | grep -vE "^(Fra:|Read prefs|Blender quit)" | tail -200
          ls -la out out/preview || true
      - uses: actions/upload-artifact@v4
        with:
          name: cine-models
          path: out
